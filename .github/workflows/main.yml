name: Deploy FastAPI to GHCR

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/imcoder0000/fastapi:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest



    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for Continuous Deploy
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: imcoder0000
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Image with Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/imcoder0000/fastapi:latest
            ghcr.io/imcoder0000/fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: [ self-hosted, deploy-fastapi ]

    steps:
      - name: Deploy to Production
        run: |
          echo "▶ Deploying to Production Server..."

          cd /home/ec2-user/jobspoon/fastapi
          if [ -f docker-compose.yml ]; then
            docker-compose down
          else
            echo "⚠ docker-compose.yml not found, skipping docker-compose down"
          fi

          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u imcoder0000 --password-stdin
          docker pull ghcr.io/imcoder0000/fastapi:latest

          docker image prune -f
          docker logout

          docker-compose up -d

          echo "✅ Deployment Complete!"
